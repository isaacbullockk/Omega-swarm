services:
  - type: web
    name: omega-swarm
    runtime: docker
    repo: https://github.com/isaacbullockk/Omega-swarm.git
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
    healthCheckPath: /api/health
    plan: free
