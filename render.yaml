services:
  - type: web
    name: omega-swarm
    runtime: node
    repo: https://github.com/isaacbullockk/Omega-swarm.git
    branch: main
    buildCommand: echo "No build needed — static files committed"
    startCommand: node server-emergency.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /api/health
    plan: free
